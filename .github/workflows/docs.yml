name: Build and Deploy Documentation

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  workflow_dispatch: # Allow manual triggers

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: |
          # Install the project with docs and cpu (non-CUDA) dependencies
          # Use cpu extra instead of all-extras to avoid conflict with cu130
          uv sync --all-groups --extra cpu
        env:
          #   Skip CUDA build for flash-attention during docs build
          FLASH_ATTENTION_SKIP_CUDA_BUILD: "TRUE"

      - name: Build documentation
        run: |
          cd docs
          uv run sphinx-build -b html . _build/html --keep-going
        env:
          # Skip CUDA build for flash-attention during docs build
          FLASH_ATTENTION_SKIP_CUDA_BUILD: "TRUE"

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  # Deployment job
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
