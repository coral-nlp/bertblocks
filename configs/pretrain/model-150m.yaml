# Ettin-base (~150M) multi-task encoder: MLM + bag-of-subwords + isotropy.
# Architecture: flash attention with ModernBERT-style windowed (local/global) attention + ALiBi.
# Loss weights are training-time (model_kwargs), kept out of the serialized model config.
model:
  class_path: bertblocks.training.modules.BertBlocksPretrainingModule
  init_args:
    objective: ${data.init_args.objective}
    pretrained_tokenizer_name_or_path: ${data.init_args.pretrained_tokenizer_name_or_path}
    compile_model: true
    optimizer_class: adamw
    optimizer_quantized: false
    optimizer_kwargs:
      betas: [0.9, 0.98]
      eps: 1.0e-8
    learning_rate: 5.0e-4
    weight_decay: 1.0e-5
    scheduler_warmup_kind: linear
    scheduler_warmup_steps: 2000
    scheduler_training_kind: constant
    scheduler_training_steps: -1
    scheduler_cooldown_kind: linear
    scheduler_cooldown_steps: 0
    model_kwargs:
      bow_loss_weight: 1.0
      isotropy_loss_weight: 1.0
    model_config_kwargs:
      hidden_size: 768
      num_blocks: 22
      num_attention_heads: 12
      intermediate_size: 1152
      max_sequence_length: 8192
      attn_implementation: flash_attention_2
      block_pos_enc_kind: alibi
      # Windowed (sliding-window) attention on every layer; 0 disables global attention entirely.
      local_attention: [64, 64]
      global_attention_every_n_layers: 0
      mlp_type: glu
      norm_kind: pre
      norm_fn: rms
      actv_fn: silu
      head_type: glu
