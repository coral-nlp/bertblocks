seed_everything: 153201820 # For reproducibility
trainer:
  accelerator: "gpu"
  accumulate_grad_batches: 32
  max_epochs: 1
  gradient_clip_val: 1.0
model:
  class_path: bertblocks.training.modules.BertBlocksPretrainingModule
  init_args:
    learning_rate: 1e-4
    weight_decay: 1e-5
    scheduler_warmup_steps: 1000
    scheduler_warmup_decay: 0.1
    pretrained_tokenizer_name_or_path: ${data.init_args.pretrained_tokenizer_name_or_path}
    compile_model: false
    optimizer_class: 'adamw'
    optimizer_kwargs:
      lr: 1e-4
      weight_decay: 0.01
    model_config_kwargs:
      hidden_size: 768
      num_blocks: 12
      num_attention_heads: 12
      intermediate_size: 3072
      actv_fn: "gelu"
      norm_kind: "post"
      norm_fn: "layer"
      norm_bias: True
      emb_pos_enc_kind: "learned"
      max_sequence_length: ${data.init_args.max_sequence_length}
      mlp_in_bias: true
      mlp_out_bias: true
      attn_implementation: "flash_attention_2"
      attn_proj_bias: true
      attn_out_bias: true
      norm_eps: 1e-05
      vocab_size: 30522
      type_vocab_size: 2
      add_token_type_emb: true
      attn_dropout_prob: 0.1
      classifier_dropout: 0.0
      emb_dropout_prob: 0.1
      global_attention_every_n_layers: 0
      hidden_dropout_prob: 0.1
      pad_token_id: 0
      head_type: "proj"
      include_final_norm: false
      tie_word_embeddings: true
data:
  class_path: bertblocks.training.modules.BertBlocksPretrainingDataModule
  init_args:
    pretrained_tokenizer_name_or_path: "bert-base-uncased"
    dataset_name_or_path: "roneneldan/TinyStories"
    max_sequence_length: 512
    train_batch_size: 32
    val_batch_size: 16
    num_workers: 4
    collator_kwargs:
      mlm_probability: 0.3
